<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Перестановка частей изображения</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <h1>Перестановка частей изображения</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/process" enctype="multipart/form-data">
        <fieldset>
            <legend>Параметры</legend>
            <p>
                <label><input type="radio" name="direction" value="lr" checked> Левая и правая части</label><br>
                <label><input type="radio" name="direction" value="tb"> Верхняя и нижняя части</label>
            </p>
            <p><input type="file" name="image" accept="image/*" required></p>
            <div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>
            <p><button type="submit">Обработать</button></p>
        </fieldset>
    </form>
</body>
</html>
